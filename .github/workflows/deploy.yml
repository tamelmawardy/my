name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ "main" ] # Triggers on push to the 'main' branch
  workflow_dispatch:     # Allows manual trigger from the Actions tab

# Sets permissions for the GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Web Support
        run: flutter config --enable-web

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web App
        # If your site is for a project page (username.github.io/REPO_NAME), you need to set the base-href.
        # For a user/organization site (username.github.io), you can omit the base-href part.
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4